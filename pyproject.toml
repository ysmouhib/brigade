[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brigade"
version = "0.2.0"
description = "Neuro-symbolic Lean 4 formalization library and kernel-checked proving brigade for Ramsey Theory and the Hales-Jewett theorem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/ysmouhib/brigade"
Repository = "https://github.com/ysmouhib/brigade"
Issues = "https://github.com/ysmouhib/brigade/issues"

[project.scripts]
brigade = "brigade.cli:main"
hj-brigade = "brigade.cli:main"

[tool.setuptools.packages.find]
include = ["brigade*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
